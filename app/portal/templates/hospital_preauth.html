<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apollo-Care Insurer Pre-Auth Portal (Portal B)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #f0fdf4; color: #1e293b; padding: 2rem 1rem; }
    .container { max-width: 820px; margin: 0 auto; background: #ffffff; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08); padding: 2rem; border-top: 4px solid #059669; }
    header { border-bottom: 2px solid #e2e8f0; padding-bottom: 1rem; margin-bottom: 1.5rem; }
    header h1 { font-size: 1.5rem; color: #065f46; display: flex; align-items: center; gap: 8px; }
    header p { font-size: 0.875rem; color: #64748b; margin-top: 0.25rem; }
    .badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; background: #d1fae5; color: #065f46; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { margin-bottom: 1rem; }
    .form-group.full { grid-column: span 2; }
    label { display: block; font-size: 0.875rem; font-weight: 600; color: #334155; margin-bottom: 0.35rem; }
    input, select, textarea { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; color: #0f172a; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #059669; ring: 2px solid #a7f3d0; }
    .actions { display: flex; gap: 1rem; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; }
    .btn { padding: 0.65rem 1.5rem; font-size: 0.95rem; font-weight: 600; border-radius: 6px; cursor: pointer; border: none; text-align: center; text-decoration: none; }
    .btn-primary { background: #059669; color: #ffffff; }
    .btn-primary:hover { background: #047857; }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    
    /* Judge Mutation Floating Widget */
    #judge-chaos-panel { position: fixed; top: 1rem; right: 1rem; background: #1e1e24; color: #fff; padding: 0.75rem 1rem; border-radius: 8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); font-size: 0.8rem; z-index: 9999; }
    #judge-chaos-panel select, #judge-chaos-panel button { font-size: 0.8rem; padding: 0.3rem 0.5rem; border-radius: 4px; margin-top: 0.4rem; }
    #judge-chaos-panel button { background: #ef4444; color: #fff; border: none; cursor: pointer; font-weight: bold; }
    footer { margin-top: 2rem; text-align: center; font-size: 0.75rem; color: #94a3b8; }
  </style>
</head>
<body>

  <!-- Floating Judge Chaos Mutator Control -->
  <div id="judge-chaos-panel">
    <div><strong>⚡ Chaos Mutator (Portal B)</strong></div>
    <div>Current: <span id="current-mutation-badge">{{ mutation.type }}</span></div>
    <select id="judge-mutation-select">
      <option value="none">Normal (No mutation)</option>
      <option value="M1">M1: rename_ids</option>
      <option value="M2">M2: relabel</option>
      <option value="M3">M3: reorder</option>
      <option value="M4">M4: retag</option>
      <option value="M5">M5: decoy</option>
      <option value="M6">M6: combo (Judge Button)</option>
    </select>
    <button id="judge-apply-mutate">Mutate</button>
  </div>

  <div class="container">
    <header>
      <span class="badge">Portal B • Healthcare TPA Clearinghouse</span>
      <h1>🏥 Apollo-Care Cashless Pre-Auth Portal</h1>
      <p>Submit patient hospital admission requests for insurer policy clearance.</p>
    </header>

    <form id="preauth_form" action="/portal_b/preauth" method="POST" data-k0-form="preauth">
      <div class="grid">
        <div class="form-group">
          <label for="patient_id">Patient ID</label>
          <input type="text" id="patient_id" name="patient_id" class="form-control"
                 placeholder="e.g. PT-10492" value="{{ fields.patient_id or '' }}" required
                 data-k0-field="patient_id">
        </div>

        <div class="form-group">
          <label for="patient_name">Patient Full Name</label>
          <input type="text" id="patient_name" name="patient_name" class="form-control"
                 placeholder="Full Legal Name" value="{{ fields.patient_name or '' }}" required
                 data-k0-field="patient_name">
        </div>

        <div class="form-group">
          <label for="policy_number">Health Policy Number</label>
          <input type="text" id="policy_number" name="policy_number" class="form-control"
                 placeholder="e.g. POL-88219" value="{{ fields.policy_number or '' }}" required
                 data-k0-field="policy_number">
        </div>

        <div class="form-group">
          <label for="insurer_id">Insurer / TPA Code</label>
          <input type="text" id="insurer_id" name="insurer_id" class="form-control"
                 placeholder="e.g. TPA-STAR-01" value="{{ fields.insurer_id or 'TPA-STAR-01' }}" required
                 data-k0-field="insurer_id">
        </div>

        <div class="form-group">
          <label for="diagnosis_code">ICD-10 Diagnosis Code</label>
          <input type="text" id="diagnosis_code" name="diagnosis_code" class="form-control"
                 placeholder="e.g. J18, K35, M16" value="{{ fields.diagnosis_code or '' }}" required
                 data-k0-field="diagnosis_code">
        </div>

        <div class="form-group">
          <label for="treatment_type">Treatment Description</label>
          <input type="text" id="treatment_type" name="treatment_type" class="form-control"
                 placeholder="e.g. Inpatient Therapy" value="{{ fields.treatment_type or '' }}" required
                 data-k0-field="treatment_type">
        </div>

        <div class="form-group">
          <label for="hospital_id">Hospital Network ID</label>
          <input type="text" id="hospital_id" name="hospital_id" class="form-control"
                 placeholder="e.g. HSP-001" value="{{ fields.hospital_id or 'HSP-001' }}" required
                 data-k0-field="hospital_id">
        </div>

        <div class="form-group">
          <label for="admission_date">Proposed Admission Date</label>
          <input type="text" id="admission_date" name="admission_date" class="form-control"
                 placeholder="YYYY-MM-DD" value="{{ fields.admission_date or '' }}" required
                 data-k0-field="admission_date">
        </div>

        <div class="form-group full">
          <label for="estimated_cost">Estimated Procedure Cost (₹)</label>
          <input type="text" id="estimated_cost" name="estimated_cost" class="form-control"
                 placeholder="0.00" value="{{ fields.estimated_cost or '' }}" required
                 data-k0-field="estimated_cost">
        </div>
      </div>

      <div class="actions">
        <button type="submit" id="submit-preauth-btn" class="btn btn-primary" data-k0-action="submit">Submit Pre-Authorization</button>
        <button type="reset" id="reset-btn" class="btn btn-secondary">Clear</button>
      </div>
    </form>

    <footer>
      Protected by Apollo Health Exchange • Real-time TPA Verification Gateway
    </footer>
  </div>

  <script src="/portal/static/mutations.js"></script>
</body>
</html>
