<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meridian Vendor Claim Portal - Claim Submitted</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #f8fafc; color: #1e293b; padding: 3rem 1rem; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); padding: 2.5rem; text-align: center; }
    .success-icon { width: 64px; height: 64px; background: #dcfce7; color: #15803d; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1.5rem auto; }
    h1 { font-size: 1.5rem; color: #0f172a; margin-bottom: 0.5rem; }
    p { color: #64748b; font-size: 0.95rem; margin-bottom: 1.5rem; }
    .claim-box { background: #f1f5f9; border-radius: 6px; padding: 1rem; margin-bottom: 2rem; }
    .claim-ref { font-size: 1.25rem; font-weight: 700; color: #0f172a; letter-spacing: 0.05em; }
    .btn { display: inline-block; padding: 0.75rem 1.75rem; background: #2563eb; color: #ffffff; text-decoration: none; font-weight: 600; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container" data-k0-page="done">
    <div class="success-icon">✓</div>
    <h1>Payment Authorized &amp; Posted</h1>
    <p>The vendor invoice claim has been recorded in the company accounts payable ledger.</p>
    <div class="claim-box">
      <div>Claim Reference ID</div>
      <div class="claim-ref" id="claim_reference_id" data-k0-field="claim_reference">{{ claim_id }}</div>
    </div>
    <a href="/portal/claim" class="btn" id="btn_new_claim" data-k0-action="new_claim">Process Another Invoice</a>
  </div>
</body>
</html>
